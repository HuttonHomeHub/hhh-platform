name: CI

on:
  # Pushes to main are checked by publish-release.yml, which calls this workflow
  # before releasing, so main isn't listed here (avoids running CI twice).
  push:
    branches: [dev, 'claude/**']
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

jobs:
  # The one check the rulesets require.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # typecheck, lint, format check, tests with coverage, release bundle, audit
      - name: Run checks
        run: npm run check
